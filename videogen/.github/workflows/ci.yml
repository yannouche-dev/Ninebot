# Tests à chaque push et pull request : interface (types, unitaires, parcours complet contre les mocks),
# scripts de l'instance (ShellCheck, agent, vrai Caddy), scan de secrets.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: ShellCheck
        run: shellcheck -S warning instance/onstart.sh
      - name: Caddy (même version et même empreinte que sur l'instance)
        run: |
          V=$(grep -oP '^CADDY_VERSION=\K.*' instance/onstart.sh)
          SUM=$(grep -oP '^CADDY_SHA256=\K.*' instance/onstart.sh)
          curl -fsSL -o caddy.tgz "https://github.com/caddyserver/caddy/releases/download/v$V/caddy_${V}_linux_amd64.tar.gz"
          echo "$SUM  caddy.tgz" | sha256sum -c -
          tar -xzf caddy.tgz caddy
          COMFY_ACCESS_TOKEN=$(printf 'x%.0s' {1..43}) ALLOWED_ORIGIN=https://example.github.io VG_LOG_DIR=$RUNNER_TEMP \
            ./caddy validate --config instance/Caddyfile --adapter caddyfile
          echo "CADDY_BIN=$PWD/caddy" >> "$GITHUB_ENV"
      - name: Tests de l'agent et du Caddyfile
        run: python -m unittest discover -s tests/instance -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
