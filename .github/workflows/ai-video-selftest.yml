name: "Vidéo IA – selftest (temporaire)"

on:
  push:
    branches: [ccr-2aef11fd-zsc4rw]
    paths: ['ai-video/**', '.github/workflows/ai-video-*.yml']

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  e2e-hf:
    uses: ./.github/workflows/ai-video-generate.yml
    secrets: inherit
    with:
      prompt: "un chat roux qui fait du surf sur une vague au coucher du soleil"
      engine: auto
      format: landscape
      duration: "4"

  e2e-cpu:
    uses: ./.github/workflows/ai-video-generate.yml
    secrets: inherit
    with:
      prompt: "un renard roux qui court dans la neige en forêt, lumière dorée"
      engine: cpu
      format: portrait
      duration: "3"
      seed: "7"

  previews:
    needs: [e2e-hf, e2e-cpu]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          path: dl
      - name: Contact sheets → temporary branch
        run: |
          pip install -q imageio-ffmpeg
          FF=$(python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())")
          mkdir -p prev
          for d in dl/*/; do
            n=$(basename "$d")
            cp "$d/meta.json" "prev/$n.json"
            "$FF" -loglevel error -y -i "$d/video.mp4" -vf "fps=2,scale=300:-2,tile=4x2" -frames:v 1 "prev/$n-sheet.jpg"
          done
          ls -la prev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ai-video-selftest-previews
          git rm -rfq .
          git add prev
          git commit -qm "selftest previews"
          git push -f origin HEAD:refs/heads/ai-video-selftest-previews
